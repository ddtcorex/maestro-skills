name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty .codex-plugin/plugin.json
          jq empty .agents/plugins/marketplace.json
          test -x install.sh
          bash -n install.sh

  release:
    needs: validate
    uses: ddtcorex/dsh-maestro-ci/.github/workflows/node-release.yml@22511d64e0dec4e5926388848a347973ec2e3b12
    with:
      pnpm-version: ""
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
